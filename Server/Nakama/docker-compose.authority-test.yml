# Isolated local verification only. Never expose these development credentials publicly.
services:
  database:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: authority_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: authority_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "authority_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  server:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        /nakama/nakama migrate up --database.address postgres:authority_test_only@database:5432/authority_test &&
        exec /nakama/nakama --name authority-test
        --database.address postgres:authority_test_only@database:5432/authority_test
        --socket.server_key authority-test-key
        --console.password authority-test-console
        --runtime.env OBJECT_HEAD_WORKER_KEY=isolated-test-worker-key-not-for-production-0916
        --logger.level INFO
    ports:
      - "127.0.0.1:17350:7350"
    volumes:
      - ./modules:/nakama/data/modules:ro
